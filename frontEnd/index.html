<!doctype html>
<html lang="en" data-theme="light" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Swizcoin — We Deliver Wealth. Not Just Promises. Twenty-year progressive unlock schedules and algorithmic dynamic pricing."
    />
    <link rel="icon" href="/favicon.svg" />
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var themeParam = params.get("theme");
          if (themeParam === "dark" || themeParam === "light") {
            localStorage.setItem("swiz_theme_mode", themeParam);
          }
          var mode = localStorage.getItem("swiz_theme_mode");
          if (mode === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            document.documentElement.className = "dark";
          } else {
            document.documentElement.setAttribute("data-theme", "light");
            document.documentElement.className = "light";
          }
        } catch(e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Swizcoin — Progressive Unlock Protocol</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
